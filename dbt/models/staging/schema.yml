version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              to: ref('stg_customers')
              field: customer_id

  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: stg_sellers
    columns:
      - name: seller_id
        data_tests: [unique, not_null]

  - name: stg_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: stg_order_items
    # Pas de test relationships order_id → stg_orders :
    # stg_orders est filtré sur 'delivered' uniquement, mais stg_order_items
    # contient les articles de toutes les commandes (shipped, canceled…).
    # Les 2 461 order_id manquants sont du périmètre exclu, pas des orphelins.
