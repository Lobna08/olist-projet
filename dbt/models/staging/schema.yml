version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
          # Toute commande delivered doit avoir au moins un item — règle métier forte
          - relationships:
              to: ref('int_order_items')
              field: order_id
      - name: customer_id
        data_tests:
          - relationships:
              to: ref('stg_customers')
              field: customer_id

  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: stg_sellers
    columns:
      - name: seller_id
        data_tests: [unique, not_null]

  - name: stg_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: stg_order_items
    # Test dans l'autre sens : toute commande delivered doit avoir au moins un item.
    # (stg_order_items → stg_orders serait un faux positif : stg_orders est filtré
    #  sur delivered, les items des autres statuts n'ont pas de parent dans cette vue.)
