# Thème clair, sobre, professionnel — palette de référence de la skill dataviz
# (surface claire, encre foncée, accent bleu). Le thème sombre par défaut de
# Streamlit n'était pas un choix délibéré du premier jet du dashboard, juste
# l'absence de config explicite — corrigé ici.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
font = "sans serif"
